name: Build Windows packages

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build self-contained downloads
        run: ./Build-Release.ps1
      - name: Run core checks without opening the wallpaper
        run: |
          $test = Start-Process './artifacts/Portable/CipherRain.exe' -ArgumentList '--test "artifacts/Core Tests.json"' -WindowStyle Hidden -Wait -PassThru
          if ($test.ExitCode -ne 0) { throw 'Core tests failed' }
          $report = Get-Content './artifacts/Core Tests.json' -Raw | ConvertFrom-Json
          if ($report.passed -ne 39 -or @($report.checks | Where-Object { !$_.pass }).Count -gt 0) { throw 'Unexpected core results' }
          Write-Output "Passed $($report.passed) core checks."
      - name: Save downloads and verification
        uses: actions/upload-artifact@v4
        with:
          name: Cipher-Rain-Windows-x64
          path: |
            artifacts/Cipher Rain Setup.exe
            artifacts/Cipher Rain Portable.zip
            artifacts/SHA256SUMS.txt
            artifacts/Release SHA256.json
            artifacts/Core Tests.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
